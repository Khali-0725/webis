name: Keep backend alive

# Render's free web services sleep after ~15 minutes idle (cold start takes
# 30-50s on the next real request). Pinging the health endpoint every 10
# minutes keeps it awake without ever needing a paid plan.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sf --max-time 60 https://webis-f9qa.onrender.com/api/health || \
          echo "Ping failed or the service was waking up - not treated as a failure."
